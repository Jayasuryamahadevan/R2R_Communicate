[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasp-harness"
version = "0.1.0"
description = "Reference harness for secure federated autonomous systems"
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[tool.setuptools.packages.find]
include = ["fasp_harness*"]
