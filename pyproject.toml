[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fasp-harness"
version = "0.1.0"
description = "Reference harness for secure federated autonomous systems"
requires-python = ">=3.11"
dependencies = ["cryptography>=42", "starlette>=0.37", "uvicorn>=0.30", "rfc8785==0.1.4", "websockets>=13"]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.100", "httpx2>=2.0"]
dev = ["ruff>=0.16"]

[tool.setuptools.packages.find]
include = ["fasp_harness*"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501"]
