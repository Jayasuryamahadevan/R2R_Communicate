<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 760" role="img" aria-labelledby="title desc">
  <title id="title">FASP reference architecture and trust boundaries</title>
  <desc id="desc">A sender node normalizes local inputs into packets, streams, or artifact references, signs them, and sends them over an IP or Bluetooth bearer. The receiving node verifies identity, authorizes scope, journals work, and calls a declared local adapter. Physical safety remains in a separate local controller.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#dce7df" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#31876a"/></marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#97b4a3"/></marker>
    <style>
      .bg{fill:#f3f7f2}.grid{fill:url(#grid)}.node{fill:#fff;stroke:#a9c6b3;stroke-width:2}.node-title{font:700 14px 'DM Mono',monospace;letter-spacing:1.8px;fill:#37785d}.node-sub{font:12px 'DM Sans',sans-serif;fill:#74887a}.card{fill:#fff;stroke:#d2dfd5;stroke-width:1.5}.card-green{fill:#eaf6ed;stroke:#94c3a5;stroke-width:1.5}.card-dark{fill:#14272b;stroke:#314f49;stroke-width:1.5}.h{font:600 18px 'Space Grotesk',sans-serif;fill:#172b2d}.p{font:13px 'DM Sans',sans-serif;fill:#62746c}.small{font:11px 'DM Mono',monospace;fill:#708a7c;letter-spacing:.4px}.tiny{font:10px 'DM Mono',monospace;fill:#a8c6b5;letter-spacing:1px}.bright{font:600 17px 'Space Grotesk',sans-serif;fill:#edfaf0}.bright-small{font:12px 'DM Sans',sans-serif;fill:#a7c7b7}.arrow{fill:none;stroke:#31876a;stroke-width:2.5;marker-end:url(#arrow)}.thin-arrow{fill:none;stroke:#97b4a3;stroke-width:1.8;marker-end:url(#arrow-light)}.observe{fill:none;stroke:#b08349;stroke-width:2;stroke-dasharray:7 6;marker-end:url(#arrow-light)}.pill{fill:#d8efe0}.pill-text{font:10px 'DM Mono',monospace;fill:#2d7759;letter-spacing:.7px}.rule{stroke:#dbe7dc;stroke-width:1}
    </style>
  </defs>
  <rect class="bg" width="1700" height="760" rx="14"/><rect class="grid" width="1700" height="760" rx="14"/>
  <text x="38" y="42" class="small">REFERENCE FLOW / NODE-TO-NODE / NOT TO SCALE</text>
  <text x="1660" y="42" class="small" text-anchor="end">FASP 1.0 · TRUST IS LOCAL</text>

  <rect x="28" y="70" width="900" height="382" rx="12" class="node"/>
  <text x="54" y="104" class="node-title">SENDER NODE A</text><text x="904" y="104" class="node-sub" text-anchor="end">identity · local policy · adapter boundary</text>

  <rect x="52" y="132" width="155" height="188" rx="8" class="card"/>
  <text x="70" y="161" class="small">LOCAL INPUTS</text>
  <rect x="68" y="180" width="122" height="30" rx="4" class="card-green"/><text x="129" y="200" class="p" text-anchor="middle">Agent / service</text>
  <rect x="68" y="220" width="122" height="30" rx="4" class="card-green"/><text x="129" y="240" class="p" text-anchor="middle">Robot / device</text>
  <rect x="68" y="260" width="122" height="40" rx="4" class="card-green"/><text x="129" y="277" class="p" text-anchor="middle">Broker / bus</text><text x="129" y="291" class="small" text-anchor="middle">via adapter</text>

  <path d="M207 227H232" class="arrow"/>
  <rect x="239" y="132" width="174" height="188" rx="8" class="card"/>
  <text x="256" y="161" class="small">SOURCE ADAPTER</text>
  <text x="256" y="198" class="h">Validate</text><text x="256" y="221" class="p">decode · schema</text>
  <text x="256" y="248" class="h">Provenance</text><text x="256" y="271" class="p">retain source identity</text>
  <text x="256" y="298" class="p">reject invalid input</text>

  <path d="M413 227H438" class="arrow"/>
  <rect x="445" y="132" width="196" height="188" rx="8" class="card"/>
  <text x="462" y="161" class="small">CANONICAL FORM</text>
  <rect x="462" y="178" width="162" height="33" rx="4" class="card-green"/><text x="477" y="200" class="h">Packet</text><text x="608" y="199" class="small" text-anchor="end">one event</text>
  <rect x="462" y="220" width="162" height="33" rx="4" class="card-green"/><text x="477" y="242" class="h">Stream</text><text x="608" y="241" class="small" text-anchor="end">leased feed</text>
  <rect x="462" y="262" width="162" height="33" rx="4" class="card-green"/><text x="477" y="284" class="h">Artifact</text><text x="608" y="283" class="small" text-anchor="end">one-time result</text>

  <path d="M641 227H666" class="arrow"/>
  <rect x="673" y="132" width="226" height="188" rx="8" class="card-dark"/>
  <text x="693" y="161" class="tiny">SIGNED ENVELOPE</text>
  <text x="693" y="199" class="bright">Ed25519 signature</text>
  <text x="693" y="224" class="bright-small">canonical JSON · identity</text>
  <text x="693" y="246" class="bright-small">recipient · expiry · nonce</text>
  <line x1="693" y1="263" x2="878" y2="263" stroke="#37564d"/>
  <text x="693" y="286" class="tiny">INLINE LIMIT · 64 KiB</text>
  <rect x="54" y="351" width="846" height="68" rx="6" fill="#f2f7f2" stroke="#d8e4da"/>
  <text x="75" y="379" class="small">NODE OWNS</text><text x="75" y="400" class="p">Private identity · source adapters · durable work state · local grants</text>

  <path d="M928 226H961" class="arrow"/>
  <rect x="969" y="132" width="168" height="188" rx="8" class="card"/>
  <text x="985" y="161" class="small">BEARER</text>
  <text x="985" y="194" class="h">HTTPS REST</text><text x="985" y="214" class="p">Ethernet · Wi-Fi</text>
  <line x1="985" y1="229" x2="1120" y2="229" class="rule"/>
  <text x="985" y="251" class="h">WebSocket</text><text x="985" y="271" class="p">push · bidirectional</text>
  <line x1="985" y1="285" x2="1120" y2="285" class="rule"/>
  <text x="985" y="307" class="h">Bluetooth</text>
  <text x="1053" y="339" class="small" text-anchor="middle">RFCOMM · LE L2CAP</text>

  <rect x="1150" y="70" width="520" height="382" rx="12" class="node"/>
  <text x="1176" y="104" class="node-title">RECEIVER NODE B</text><text x="1644" y="104" class="node-sub" text-anchor="end">independent identity · local decision</text>
  <path d="M1137 226H1166" class="arrow"/>
  <rect x="1174" y="132" width="142" height="188" rx="8" class="card-dark"/>
  <text x="1190" y="162" class="tiny">VERIFY</text><text x="1190" y="194" class="bright">Signature</text><text x="1190" y="219" class="bright-small">peer · audience</text><text x="1190" y="242" class="bright-small">expiry · replay</text><text x="1190" y="286" class="tiny">REJECT EARLY</text>
  <path d="M1316 226H1330" class="arrow"/>
  <rect x="1337" y="132" width="142" height="188" rx="8" class="card"/>
  <text x="1353" y="162" class="small">AUTHORIZE</text><text x="1353" y="194" class="h">Pairing</text><text x="1353" y="218" class="p">capability scope</text><text x="1353" y="243" class="p">grant · local policy</text><text x="1353" y="286" class="small">DENY BY DEFAULT</text>
  <path d="M1479 226H1493" class="arrow"/>
  <rect x="1500" y="132" width="146" height="188" rx="8" class="card"/>
  <text x="1516" y="162" class="small">JOURNAL + ROUTE</text><text x="1516" y="194" class="h">Deduplicate</text><text x="1516" y="218" class="p">durable work state</text><text x="1516" y="243" class="p">bounded dispatch</text><text x="1516" y="286" class="small">THEN ADAPTER</text>
  <rect x="1176" y="351" width="468" height="68" rx="6" fill="#f2f7f2" stroke="#d8e4da"/>
  <text x="1196" y="379" class="small">RECEIVER OWNS</text><text x="1196" y="400" class="p">Peer approval · grants · replay state · stream consent · adapter policy</text>

  <path d="M1573 452V492H1348" class="thin-arrow"/>
  <rect x="1120" y="510" width="260" height="112" rx="8" class="card-green"/>
  <text x="1143" y="540" class="small">LOCAL ADAPTER</text><text x="1143" y="570" class="h">Declared capability</text><text x="1143" y="594" class="p">goal · observation · coordination</text>
  <path d="M1380 566H1413" class="arrow"/>
  <rect x="1421" y="510" width="249" height="112" rx="8" class="card"/>
  <text x="1444" y="540" class="small">LAYER 2 · LOCAL AUTONOMY</text><text x="1444" y="570" class="h">Robot / service</text><text x="1444" y="594" class="p">navigation · execution · device API</text>
  <rect x="1120" y="652" width="550" height="72" rx="8" fill="#fff8ee" stroke="#dfbf91" stroke-width="1.5"/>
  <text x="1143" y="680" class="small" fill="#936c36">LAYER 1 · SEPARATE SAFETY CONTROLLER</text><text x="1143" y="704" class="p">E-stop · protective fields · motor loops · hard real-time limits</text>
  <path d="M1120 687H1092V390H1150" class="observe"/>
  <rect x="978" y="483" width="126" height="28" rx="14" class="pill"/><text x="1041" y="502" class="pill-text" text-anchor="middle">OBSERVE ONLY</text>
  <text x="53" y="565" class="node-title">SAFETY INVARIANT</text>
  <text x="53" y="600" class="h">The network can request work.</text><text x="53" y="629" class="h">Only the local system decides.</text>
  <text x="53" y="677" class="p">Link encryption protects the connection.</text><text x="53" y="700" class="p">Identity, authorization, and safety checks remain local to each node.</text>
</svg>
