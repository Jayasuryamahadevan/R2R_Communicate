name: CodeQL

# Scans every push and PR rather than only a schedule: an alert that lands a
# week late is an alert nobody acts on. CodeQL is free for public repositories.
on:
  push:
    branches: [main, ABB, master]
  pull_request:
    branches: [main, ABB, master]
  schedule:
    # Weekly, because a query can be improved upstream after your code merged
    # clean. This is how a new pattern reaches code that was already green.
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # No build mode for Python. The JS/TS bridges are extension sources
          # that are built by their own tooling, and autobuild would drag
          # node_modules through the extractor for no additional coverage.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
        if: matrix.language == 'javascript-typescript'

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
