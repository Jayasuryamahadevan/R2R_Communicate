name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the website
        run: node site/build.mjs
      # docs/ is committed so Pages has something to publish and contributors
      # can preview without Node. This gate is what stops it drifting from the
      # sources in site/, which is the only place content should be edited.
      - name: Verify docs/ matches site/
        run: |
          git diff --exit-code --stat -- docs/
          echo "docs/ is out of date with site/ — run: node site/build.mjs"

      - name: Verify internal links resolve
        run: node site/check-links.mjs

      # Rendered checks. These catch the failures unit tests cannot see:
      # text overlapping text, content escaping the viewport, and contrast
      # that silently breaks when a colour token changes.
      - name: Verify layout
        run: node site/audit-layout.mjs
      - name: Verify colour contrast
        run: node site/audit-contrast.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked package and test dependencies
        run: |
          python -m pip install uv==0.12.6
          uv sync --python ${{ matrix.python-version }} --locked --extra test --extra dev
      - name: Verify production requirements match the lockfile
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --offline --output-file requirements-prod.txt > /dev/null
          git diff --exit-code -- requirements-prod.txt
      - name: Lint
        run: uv run --locked --extra test --extra dev ruff check fasp_harness tests benchmarks
      - name: Independent JavaScript peer conformance
        run: |
          cmp bridge_core/fasp_canonical.mjs interop/fasp-canonical.mjs
          node --test interop/fasp-peer.test.mjs
      - name: Build native C/C++ library example
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic -c interop/native_c/fasp_wire.c -o /tmp/fasp_wire_ci.o
          c++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic interop/native_c/api_smoke.cpp /tmp/fasp_wire_ci.o -lcrypto -o /tmp/fasp_native_ci
          /tmp/fasp_native_ci
      - name: Run test suite
        run: uv run --locked --extra test --extra dev python -m unittest discover -s tests -v
      - name: Persistent TLS and volatile-delivery smoke benchmark
        run: uv run --locked --extra test --extra dev python -m benchmarks.channel --iterations 100 > channel-benchmark.json
      - name: Record bounded ingress saturation behavior
        run: uv run --locked --extra test --extra dev python -m benchmarks.saturation > saturation-benchmark.json
      - name: Verify installed wheel and packaged migrations
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv /tmp/fasp-wheel-verify
          /tmp/fasp-wheel-verify/bin/python -m pip install --require-hashes -r requirements-prod.txt
          /tmp/fasp-wheel-verify/bin/python -m pip install --no-deps dist/fasp_harness-*.whl
          # Exercise the actual installed agent binary, not only Python imports.
          /tmp/fasp-wheel-verify/bin/fasp --help | grep -q 'communicate'
          /tmp/fasp-wheel-verify/bin/fasp serve --help | grep -q 'state-dir'
          /tmp/fasp-wheel-verify/bin/fasp init --name wheel-ci --state-dir /tmp/fasp-cli-verify > /tmp/fasp-cli-init.json
          /tmp/fasp-wheel-verify/bin/fasp peers --state-dir /tmp/fasp-cli-verify | grep -q '"peers":\[\]'
          cd /tmp
          /tmp/fasp-wheel-verify/bin/python - <<'CHECK'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from fasp_harness.storage.db import Database, MIGRATIONS_DIR
          migrations = sorted(MIGRATIONS_DIR.glob("*.sql"))
          assert len(migrations) >= 9, migrations
          with TemporaryDirectory() as directory:
              database = Database(Path(directory) / "test.db")
              assert database.read_one("SELECT name FROM sqlite_master WHERE name='work_items'") is not None
              assert database.read_one("PRAGMA user_version")[0] == len(migrations)
          CHECK

      - name: Validate production Compose and container image
        if: matrix.python-version == '3.12'
        run: |
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml config --quiet
          docker compose --env-file deploy/production/.env.example -f deploy/production/compose.yaml build --quiet
          docker run --rm --network none --entrypoint python fasp-harness:local -m fasp_harness.healthcheck --help > /dev/null
          docker run --rm --network none --user 10001:10001 --read-only --tmpfs /tmp:mode=1777,size=32m -v /home/fasp/.fasp fasp-harness:local init --name ci-smoke --base-url https://node.example.internal:8766 --state-dir /home/fasp/.fasp > /dev/null
          bash tests/container_smoke.sh fasp-harness:local

      # The operator gates, run as gates. Each exits non-zero on a failing
      # verdict, so a regression in the safety argument or the timing
      # evidence fails the build rather than being noticed later in a
      # report nobody reads.
      - name: Layer model
        run: uv run --locked --extra test --extra dev python -m fasp_harness layers
      - name: Hardware-in-the-loop safety scenarios (simulated device)
        run: uv run --locked --extra test --extra dev python -m fasp_harness hil
      - name: Zone and conduit model
        run: uv run --locked --extra test --extra dev python -m fasp_harness zones
      - name: Software bill of materials
        run: uv run --locked --extra test --extra dev python -m fasp_harness sbom > sbom.json
      - name: Safety case
        # Exits 1 here by design: E15 requires a real certified safety
        # controller, and CI has a simulator. The check is that every OTHER
        # claim still holds, and that the two that cannot are the two
        # reported.
        run: |
          uv run --locked --extra test --extra dev python -m fasp_harness safety-case --json > safety-case.json || true
          python - <<'CHECK'
          import json, sys
          report = json.load(open("safety-case.json"))
          failed = sorted(claim["id"] for claim in report["claims"] if claim["verdict"] in {"not_supported", "inconclusive"})
          expected = ["G1", "G8"]
          if failed != expected:
              print(f"Safety case regression: expected {expected} unsupported, got {failed}")
              for claim in report["claims"]:
                  print(f"  {claim['verdict']:14} {claim['id']}: {claim['detail'][:120]}")
              sys.exit(1)
          print(f"Safety case as expected: {report['counts']['supported']} supported, "
                f"{report['counts']['delegated']} delegated, {report['counts']['undeveloped']} undeveloped.")
          CHECK
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-py${{ matrix.python-version }}
          path: |
            sbom.json
            safety-case.json
            channel-benchmark.json
            saturation-benchmark.json
          if-no-files-found: ignore

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional MCP integration
        run: |
          python -m pip install uv==0.12.6
          uv sync --python 3.12 --locked --extra mcp
      - name: Exercise MCP stdio and concurrent clients
        run: uv run --locked --extra mcp python -m unittest tests.test_mcp -v
